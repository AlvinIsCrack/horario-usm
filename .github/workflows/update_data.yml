name: Actualizar y Desplegar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        env:
          LOGIN: ${{ secrets.SIGA_LOGIN }}
          SERVER: ${{ secrets.SIGA_SERVER }}
          PASSWD: ${{ secrets.SIGA_PASSWD }}
          PYTHONPATH: resources
        run: |
          pip install requests beautifulsoup4 multiprocess python-dotenv
          python resources/generar.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/lib/data/*.json
          git diff --staged --quiet || (git commit -m "chore: update data [skip ci]" && git push)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

      - name: Deploy
        uses: actions/deploy-pages@v4