name: Actualizar Horarios y Datos

on:
  schedule:
    # --- NIVEL 1: ALTA PRIORIDAD (Toma de Ramos) ---
    # Meses: Enero(1), Julio(7), Agosto(8), Diciembre(12)
    # Horario: 
    #   - 12:00 a 21:00 UTC (09:00 AM - 06:00 PM CL) -> Cada 30 min
    #   - 22:00 a 03:00 UTC (07:00 PM - 12:00 AM CL) -> Cada 1 hora
    - cron: '*/30 12-21 * 1,7,8,12 *'
    # CORRECCIÓN AQUÍ: Usamos coma para separar "antes de medianoche" y "después de medianoche"
    - cron: '0 22-23,0-3 * 1,7,8,12 *'

    # --- NIVEL 2: TRANSICIÓN ---
    # Meses: Febrero(2), Junio(6), Septiembre(9), Noviembre(11)
    # Cada 4 horas entre las 12:00 y 22:00 UTC
    - cron: '0 12-22/4 * 2,6,9,11 *'

    # --- NIVEL 3: MANTENIMIENTO ---
    # Meses: Marzo(3), Abril(4), Mayo(5), Octubre(10)
    # Una vez al día a las 12:00 UTC
    - cron: '0 12 * 3,4,5,10 *'
    
    # El resto del tiempo (madrugada) el script descansa.
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      status: ${{ steps.commit.outputs.status }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 multiprocess python-dotenv

      - name: Ejecutar script de generación
        env:
          SIGA_LOGIN: ${{ secrets.SIGA_LOGIN }}
          SIGA_SERVER: ${{ secrets.SIGA_SERVER }}
          SIGA_PASSWD: ${{ secrets.SIGA_PASSWD }}
          # Aseguramos que Python encuentre 'cookie.py' en la misma carpeta
          PYTHONPATH: ${{ github.workspace }}/resources
        run: python resources/generar.py

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Agregamos los archivos usando la ruta desde la raíz del repo
          git add src/lib/data/*.json
          
          # Solo hacemos commit si hay cambios para no romper el build
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): actualización automática de horarios [skip ci]"
            git push
          else
            echo "No hay cambios en los datos, nada que subir."
          fi
  deploy:
    needs: run-scraper
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Traer cambios hechos por el scraper

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/' # Carpeta de salida del adapter-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
