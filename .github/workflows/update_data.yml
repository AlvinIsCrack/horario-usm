name: Actualizar Horarios y Datos

on:
  schedule:
    - cron: '0 * * * *' # Ejecutar cada hora
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4 multiprocess python-dotenv

      - name: Ejecutar script de generación
        env:
          SIGA_LOGIN: ${{ secrets.SIGA_LOGIN }}
          SIGA_SERVER: ${{ secrets.SIGA_SERVER }}
          SIGA_PASSWD: ${{ secrets.SIGA_PASSWD }}
          # Aseguramos que Python encuentre 'cookie.py' en la misma carpeta
          PYTHONPATH: ${{ github.workspace }}/resources
        run: python resources/generar.py

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Intentar agregar los archivos. Si no existen, no fallar el script.
          git add usm-assist/src/lib/data/*.json || echo "No se encontraron archivos JSON para agregar"
          
          # Solo hacer commit y push si hay cambios reales en el área de stage
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): actualización automática de horarios [skip ci]"
            git push
          else
            echo "Sin cambios detectados en los datos."
          fi